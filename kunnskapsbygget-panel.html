<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunnskapsbygget</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<style>
  :root {
    --bg: #0b1220;
    --surface: #111827;
    --surface-2: #1f2937;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --border: #1f2937;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #sidebar {
    width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 0;
  }
  #sidebar h2 { font-size: 0.95rem; font-weight: 600; padding: 0 16px 16px; }
  .nav-item {
    padding: 10px 16px;
    cursor: pointer;
    font-size: 0.9rem;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item.active { background: #1e3a5f; border-left-color: var(--accent); }
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #topbar {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #1f2937;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .status-pill.GUL { color: var(--yellow); }
  .status-pill.GRØNN { color: var(--green); }
  .status-pill.RØD { color: var(--red); }
  #content { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .k-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .k-card.fakta { border-left-color: var(--green); }
  .k-card.antakelse { border-left-color: var(--yellow); }
  .k-card.hull { border-left-color: var(--red); }
  .k-card h3 { font-size: 0.95rem; margin-bottom: 6px; }
  .k-card p { font-size: 0.88rem; color: var(--muted); margin-bottom: 8px; }
  .k-card .source { font-size: 0.75rem; color: var(--muted); }
  .actions { margin-top: 10px; }
  button {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    margin-right: 6px;
  }
  button:hover { background: #374151; }
  button.selected { background: var(--accent); color: white; border-color: var(--accent); }
  #aiBar {
    border-top: 1px solid var(--border);
    padding: 12px 24px;
    background: var(--surface);
    display: flex;
    gap: 8px;
  }
  #aiInput {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 0.9rem;
  }
  #aiBar button { background: var(--accent); color: white; border: none; }
  #activity {
    width: 300px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
  }
  #activity h2 { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }
  .event { font-size: 0.82rem; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .event .time { color: var(--muted); font-size: 0.75rem; }
  .ai-reply {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    font-size: 0.88rem;
  }
</style>
</head>
<body>
  <div id="sidebar">
    <h2>Kunnskapsbygget</h2>
    <div class="nav-item active" onclick="selectPage('kunnskap')">Kunnskap</div>
    <div class="nav-item" onclick="selectPage('status')">Oversikt</div>
    <div class="nav-item" onclick="selectPage('oppgaver')">Oppgaver</div>
    <div class="nav-item" onclick="selectPage('dokumentasjon')">Dokumentasjon</div>
  </div>

  <div id="main">
    <div id="topbar">
      <div><span class="status-pill" id="statusPill">● GUL</span></div>
      <div style="font-size:0.8rem;color:var(--muted);" id="updated">Sist oppdatert: —</div>
    </div>
    <div id="content"></div>
    <div id="aiBar">
      <input id="aiInput" placeholder="Spør NORMIA AI eller søk..." onkeypress="if(event.key==='Enter')handleAI()">
      <button onclick="handleAI()">Send</button>
    </div>
  </div>

  <div id="activity">
    <h2>Hendelseslogg</h2>
    <div id="eventLog"></div>
  </div>

<script>
const KEY = "kb_panel_v1";

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return null;
}

function saveState() {
  localStorage.setItem(KEY, JSON.stringify({ cards, events, lastUpdate: new Date().toISOString() }));
}

const initialCards = [
  { id: 1, title: "Android-build feiler", content: "Build feiler på Android. OutOfMemoryError. Tre enheter.", source: "Utvikler + logg", type: "Hull", linked: false, owner: false, critical: true },
  { id: 2, title: "Kanskje minne?", content: "Tror det kan være minnet. Ikke undersøkt.", source: "Samme utvikler", type: "Antakelse", linked: false, owner: false, critical: false },
  { id: 3, title: "Art rekker ikke", content: "Art-teamet rekker ikke tre nye karakterer.", source: "Art lead", type: null, linked: false, owner: false, critical: true },
  { id: 4, title: "Tutorial for lang", content: "Spilltestere: tutorial for lang. 3/5 ga opp.", source: "Spilltest", type: "Fakta", linked: true, owner: false, critical: false }
];

let state = loadState();
let cards = state?.cards || initialCards;
let events = state?.events || [
  { time: "10:21", text: "Ny kilde analysert" },
  { time: "10:18", text: "Antakelse oppdatert" }
];

let filter = "";
let currentPage = "kunnskap";

function getStatus() {
  const open = cards.filter(c => c.critical && !(c.type && c.linked && c.owner)).length;
  if (open === 0) return "GRØNN";
  if (open >= 2) return "RØD";
  return "GUL";
}

function updateTimestamp() {
  const el = document.getElementById("updated");
  const now = new Date();
  el.textContent = "Sist oppdatert: " + now.getHours().toString().padStart(2,"0") + ":" + now.getMinutes().toString().padStart(2,"0");
}

function renderContent() {
  const s = getStatus();
  document.getElementById("statusPill").textContent = "● " + s;
  document.getElementById("statusPill").className = "status-pill " + s;
  updateTimestamp();

  if (currentPage === "status") {
    const open = cards.filter(c => c.critical && !(c.type && c.linked && c.owner));
    document.getElementById("content").innerHTML = `
      <div class="k-card">
        <h3>Status: ${s}</h3>
        <p>${open.length} kritiske kort uten full behandling.</p>
      </div>
    `;
    return;
  }

  if (currentPage === "oppgaver") {
    const open = cards.filter(c => c.critical && !(c.type && c.linked && c.owner));
    document.getElementById("content").innerHTML = `
      <div class="k-card">
        <h3>Åpne kritiske</h3>
        ${open.length ? open.map(c => `<p style="margin:6px 0;">• ${c.title}</p>`).join("") : "<p>Ingen åpne.</p>"}
      </div>
    `;
    return;
  }

  if (currentPage === "dokumentasjon") {
    document.getElementById("content").innerHTML = `
      <div class="k-card">
        <h3>Dokumentasjon</h3>
        <ul style="margin:10px 0 0 18px;color:var(--muted);">
          <li>Build-logg</li>
          <li>Spilltest</li>
          <li>Publisher-referat</li>
        </ul>
      </div>
    `;
    return;
  }

  const visible = filter
    ? cards.filter(c => (c.title + " " + c.content + " " + c.source).toLowerCase().includes(filter.toLowerCase()))
    : cards;

  document.getElementById("content").innerHTML = visible.map(c => `
    <div class="k-card ${c.type ? c.type.toLowerCase() : ''}">
      <h3>${c.type ? c.type + " · " : ""}${c.title}</h3>
      <p>${c.content}</p>
      <div class="source">Kilde: ${c.source}</div>
      <div class="actions">
        <button class="${c.type==='Fakta'?'selected':''}" onclick="setType(${c.id},'Fakta')">Fakta</button>
        <button class="${c.type==='Antakelse'?'selected':''}" onclick="setType(${c.id},'Antakelse')">Antakelse</button>
        <button class="${c.type==='Hull'?'selected':''}" onclick="setType(${c.id},'Hull')">Hull</button>
        <button class="secondary ${c.linked?'selected':''}" onclick="toggle(${c.id},'linked')">Koble</button>
        <button class="secondary ${c.owner?'selected':''}" onclick="toggle(${c.id},'owner')">Eier</button>
      </div>
    </div>
  `).join("") || `<div class="k-card">Ingen treff på «${filter}»</div>`;
}

function renderEvents() {
  document.getElementById("eventLog").innerHTML = events.slice(0, 20).map(e =>
    `<div class="event"><div class="time">${e.time}</div>${e.text}</div>`
  ).join("");
}

function setType(id, type) {
  const c = cards.find(x => x.id === id);
  c.type = c.type === type ? null : type;
  events.unshift({ time: "nå", text: c.title + " → " + type });
  saveState();
  renderContent();
  renderEvents();
}

function toggle(id, field) {
  const c = cards.find(x => x.id === id);
  c[field] = !c[field];
  events.unshift({ time: "nå", text: c.title + " " + field + (c[field] ? " satt" : " fjernet") });
  saveState();
  renderContent();
  renderEvents();
}

function selectPage(id) {
  currentPage = id;
  document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
  event.target.classList.add("active");
  filter = "";
  renderContent();
}

function handleAI() {
  const input = document.getElementById("aiInput");
  const q = input.value.trim();
  if (!q) return;

  const lower = q.toLowerCase();

  if (lower.startsWith("søk ") || lower.startsWith("finn ")) {
    filter = q.replace(/^(søk|finn)\s+/i, "");
    events.unshift({ time: "nå", text: "Søk: " + filter });
    saveState();
    renderContent();
    renderEvents();
    input.value = "";
    return;
  }

  const s = getStatus();
  const open = cards.filter(c => c.critical && !(c.type && c.linked && c.owner));
  let answer = "Jeg ser på status og kortene nå.";
  if (lower.includes("status")) answer = `Status er ${s}. ${open.length} kritiske kort mangler full behandling.`;
  else if (lower.includes("android") || lower.includes("build")) answer = "Android-build er merket som Hull og er kritisk.";
  else if (lower.includes("eier") || lower.includes("hvem")) answer = "Åpne kritiske: " + (open.map(c => c.title).join(", ") || "ingen");
  else if (lower.includes("hva") || lower.includes("nå")) answer = `Status ${s}. Åpne kritiske: ${open.length}.`;
  else answer = "Jeg kan hjelpe med status, kort og søk. Prøv «søk android» eller «status».";

  document.getElementById("content").insertAdjacentHTML("afterbegin", `<div class="ai-reply"><strong>NORMIA AI:</strong> ${answer}</div>`);
  events.unshift({ time: "nå", text: "NORMIA AI: " + q });
  saveState();
  renderEvents();
  input.value = "";
}

renderContent();
renderEvents();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
