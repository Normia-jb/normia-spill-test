<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunnskapsbygget – Pilot v3</title>
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface-2: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
    --green: #4ade80; --yellow: #fbbf24; --red: #f87171; --border: #475569;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px 0; }
  #sidebar h2 { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 0 16px 12px; }
  .tree-item { padding: 8px 16px 8px 24px; cursor: pointer; font-size: 0.95rem; border-left: 3px solid transparent; }
  .tree-item:hover { background: var(--surface-2); }
  .tree-item.active { background: #0c4a6e; border-left-color: var(--accent); }
  .tree-item.folder { font-weight: 600; padding-left: 16px; }
  .tree-item.child { padding-left: 36px; font-size: 0.9rem; color: var(--muted); }
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #header { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  #header h1 { font-size: 1.4rem; }
  #header .path { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  #content { flex: 1; overflow-y: auto; padding: 24px; }
  #chatbar { border-top: 1px solid var(--border); padding: 12px 24px; background: var(--surface); display: flex; gap: 8px; }
  #chatInput { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 0.95rem; }
  #chatbar button { margin-top: 0; white-space: nowrap; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h3 { margin-bottom: 8px; }
  .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
  .status-GRØNN { background: #14532d; color: var(--green); }
  .status-GUL { background: #713f12; color: var(--yellow); }
  .status-RØD { background: #7f1d1d; color: var(--red); }
  .event { border-left: 3px solid var(--accent); padding: 8px 12px; margin-bottom: 8px; background: var(--surface); border-radius: 0 8px 8px 0; font-size: 0.9rem; }
  .event .time { color: var(--muted); font-size: 0.75rem; }
  button { background: var(--accent); color: #0f172a; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; margin: 4px 4px 4px 0; }
  button:hover { opacity: 0.9; }
  button.secondary { background: var(--surface-2); color: var(--text); }
  button.selected { background: #0ea5e9; }
  #activity { width: 320px; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
  #activity h2 { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
  .k-card { border-left: 4px solid var(--border); }
  .k-card.fakta { border-left-color: var(--green); }
  .k-card.antakelse { border-left-color: var(--yellow); }
  .k-card.hull { border-left-color: var(--red); }
</style>
</head>
<body>
  <div id="sidebar">
    <h2>Kunnskapsbygget</h2>
    <div id="tree"></div>
  </div>
  <div id="main">
    <div id="header">
      <h1 id="title">Oversikt</h1>
      <div class="path" id="path">00_Oversikt</div>
    </div>
    <div id="content"></div>
    <div id="chatbar">
      <input id="chatInput" type="text" placeholder="Skriv her – samhandling, notat eller oppgave..." onkeypress="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()">Send</button>
    </div>
  </div>
  <div id="activity">
    <h2>Hendelser under aktivitet</h2>
    <div id="eventLog"></div>
  </div>

<script>
const structure = [
  { id: "oversikt", name: "00_Oversikt", children: [{ id: "status", name: "status.html" }] },
  { id: "prosjekt", name: "01_Prosjekt", children: [
    { id: "vertical", name: "vertical-slice", children: [
      { id: "kunnskap", name: "kunnskapskort.html" },
      { id: "oppgaver", name: "oppgaver.html" },
      { id: "dokumentasjon", name: "dokumentasjon.html" }
    ]}
  ]},
  { id: "roller", name: "02_Roller", children: [
    { id: "ag002", name: "AG-002" },
    { id: "ag003", name: "AG-003" }
  ]},
  { id: "aktivitet", name: "03_Aktivitet", children: [{ id: "logg", name: "hendelseslogg.html" }] }
];

let cards = [
  { id: 1, title: "Android-build feiler", content: "Build feiler på Android. OutOfMemoryError. Tre enheter.", source: "Utvikler + logg", type: null, linked: false, owner: false, critical: true },
  { id: 2, title: "Kanskje minne?", content: "Tror det kan være minnet. Ikke undersøkt.", source: "Samme utvikler", type: null, linked: false, owner: false, critical: false },
  { id: 3, title: "Art rekker ikke", content: "Art-teamet rekker ikke tre nye karakterer.", source: "Art lead", type: null, linked: false, owner: false, critical: true },
  { id: 4, title: "Tutorial for lang", content: "Spilltestere: tutorial for lang. 3/5 ga opp.", source: "Spilltest", type: null, linked: false, owner: false, critical: false },
  { id: 5, title: "Publisher vil ha multiplayer", content: "Publisher vil ha multiplayer i vertical slice.", source: "Produsent, muntlig", type: null, linked: false, owner: false, critical: true },
  { id: 6, title: "Noen fikset det?", content: "Hørte at noen fikset Android-problemet i går.", source: "Kantina, ubekreftet", type: null, linked: false, owner: false, critical: false },
  { id: 7, title: "Mangler lydlisens", content: "Mangler fortsatt lisens på lydbibliotek i menyen.", source: "Produsent, e-post", type: null, linked: false, owner: false, critical: true }
];

const events = [];
function addEvent(text) {
  const now = new Date();
  const time = now.getHours().toString().padStart(2,"0") + ":" + now.getMinutes().toString().padStart(2,"0");
  events.unshift({ time, text });
  renderEvents();
}
addEvent("Pilot startet");

function getStatus() {
  const criticalOpen = cards.filter(c => c.critical && !(c.type && c.linked && c.owner)).length;
  if (criticalOpen === 0) return "GRØNN";
  if (criticalOpen >= 2) return "RØD";
  return "GUL";
}

const pages = {
  status: {
    title: "Status",
    path: "00_Oversikt / status.html",
    render: () => {
      const s = getStatus();
      const open = cards.filter(c => c.critical && !(c.type && c.linked && c.owner)).length;
      return `<div class="card"><h3>Prosjektstatus</h3><p>Vertical slice – mobilspill</p>
        <p style="margin-top:8px;">Status: <span class="status status-${s}">${s}</span></p>
        <p style="margin-top:8px;color:var(--muted);">${open} kritiske kort uten full behandling.</p></div>`;
    }
  },
  kunnskap: {
    title: "Kunnskapskort",
    path: "01_Prosjekt / vertical-slice / kunnskapskort.html",
    render: () => cards.map(c => `
      <div class="card k-card ${c.type ? c.type.toLowerCase().replace(' ', '') : ''}">
        <h3>${c.title}</h3>
        <p>${c.content}</p>
        <div style="font-size:0.8rem;color:var(--muted);margin:6px 0;">${c.source}</div>
        <div>
          <button class="${c.type==='Fakta'?'selected':''}" onclick="setType(${c.id},'Fakta')">Fakta</button>
          <button class="${c.type==='Antakelse'?'selected':''}" onclick="setType(${c.id},'Antakelse')">Antakelse</button>
          <button class="${c.type==='Hull'?'selected':''}" onclick="setType(${c.id},'Hull')">Hull</button>
          <button class="secondary ${c.linked?'selected':''}" onclick="toggleLink(${c.id})">Koble</button>
          <button class="secondary ${c.owner?'selected':''}" onclick="toggleOwner(${c.id})">Eier</button>
        </div>
      </div>
    `).join("")
  },
  oppgaver: {
    title: "Oppgaver",
    path: "01_Prosjekt / vertical-slice / oppgaver.html",
    render: () => {
      const open = cards.filter(c => c.critical && !(c.type && c.linked && c.owner));
      return `<div class="card"><h3>Åpne kritiske</h3>${open.length ? open.map(c => `<p>• ${c.title}</p>`).join("") : "<p>Ingen åpne kritiske.</p>"}</div>`;
    }
  },
  dokumentasjon: {
    title: "Dokumentasjon",
    path: "01_Prosjekt / vertical-slice / dokumentasjon.html",
    render: () => `<div class="card"><h3>Dokumentasjon</h3><ul style="margin-left:18px;color:var(--muted);"><li>Build-logg</li><li>Spilltest</li><li>Publisher-referat</li></ul></div>`
  },
  ag002: { title: "AG-002", path: "02_Roller / AG-002", render: () => `<div class="card"><h3>AG-002</h3><p>Prosjektkontroll</p></div>` },
  ag003: { title: "AG-003", path: "02_Roller / AG-003", render: () => `<div class="card"><h3>AG-003</h3><p>Dokumentasjon & evidens</p></div>` },
  logg: { title: "Hendelseslogg", path: "03_Aktivitet / hendelseslogg.html", render: () => `<div class="card"><h3>Samlet logg</h3><p>Se høyre panel.</p></div>` }
};

function renderTree() {
  const tree = document.getElementById("tree");
  tree.innerHTML = "";
  structure.forEach(folder => {
    const f = document.createElement("div");
    f.className = "tree-item folder";
    f.textContent = folder.name;
    f.onclick = () => selectPage(folder.children?.[0]?.id || "status");
    tree.appendChild(f);
    (folder.children || []).forEach(child => {
      const c = document.createElement("div");
      c.className = "tree-item child";
      c.textContent = child.name;
      c.onclick = () => selectPage(child.id);
      tree.appendChild(c);
      if (child.children) {
        child.children.forEach(sub => {
          const s = document.createElement("div");
          s.className = "tree-item child";
          s.style.paddingLeft = "48px";
          s.textContent = sub.name;
          s.onclick = () => selectPage(sub.id);
          tree.appendChild(s);
        });
      }
    });
  });
}

function selectPage(id) {
  const page = pages[id] || pages.status;
  document.getElementById("title").textContent = page.title;
  document.getElementById("path").textContent = page.path;
  document.getElementById("content").innerHTML = page.render();
  document.querySelectorAll(".tree-item").forEach(el => el.classList.remove("active"));
  event?.target?.classList?.add("active");
}

function renderEvents() {
  document.getElementById("eventLog").innerHTML = events.map(e =>
    `<div class="event"><div class="time">${e.time}</div>${e.text}</div>`
  ).join("");
}

function setType(id, type) {
  const c = cards.find(x => x.id === id);
  c.type = c.type === type ? null : type;
  addEvent(`${c.title} → ${type}`);
  selectPage("kunnskap");
}
function toggleLink(id) {
  const c = cards.find(x => x.id === id);
  c.linked = !c.linked;
  addEvent(`${c.title} ${c.linked ? "koblet" : "kobling fjernet"}`);
  selectPage("kunnskap");
}
function toggleOwner(id) {
  const c = cards.find(x => x.id === id);
  c.owner = !c.owner;
  addEvent(`${c.title} ${c.owner ? "fikk eier" : "eier fjernet"}`);
  selectPage("kunnskap");
}

function sendChat() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  addEvent("Samhandling: " + text);
  input.value = "";
  const content = document.getElementById("content");
  const msg = document.createElement("div");
  msg.className = "card";
  msg.innerHTML = `<strong>Du:</strong> ${text}<div style="font-size:0.75rem;color:var(--muted);margin-top:4px;">akkurat nå</div>`;
  content.prepend(msg);
}

renderTree();
renderEvents();
selectPage("status");
</script>
</body>
</html>
