<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunnskapsbygget – Pilot</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #4ade80;
    --yellow: #fbbf24;
    --red: #f87171;
    --border: #475569;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  #sidebar {
    width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }
  #sidebar h2 {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0 16px 12px;
  }
  .tree-item {
    padding: 8px 16px 8px 24px;
    cursor: pointer;
    font-size: 0.95rem;
    border-left: 3px solid transparent;
  }
  .tree-item:hover { background: var(--surface-2); }
  .tree-item.active {
    background: #0c4a6e;
    border-left-color: var(--accent);
  }
  .tree-item.folder { font-weight: 600; padding-left: 16px; }
  .tree-item.child { padding-left: 36px; font-size: 0.9rem; color: var(--muted); }
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  #header h1 { font-size: 1.4rem; }
  #header .path { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  #content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h3 { margin-bottom: 8px; }
  .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
  .status-GRØNN { background: #14532d; color: var(--green); }
  .status-GUL { background: #713f12; color: var(--yellow); }
  .status-RØD { background: #7f1d1d; color: var(--red); }
  .event {
    border-left: 3px solid var(--accent);
    padding: 8px 12px;
    margin-bottom: 8px;
    background: var(--surface);
    border-radius: 0 8px 8px 0;
    font-size: 0.9rem;
  }
  .event .time { color: var(--muted); font-size: 0.75rem; }
  .note-input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px;
    margin-top: 8px;
  }
  button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { opacity: 0.9; }
  #activity {
    width: 320px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
  }
  #activity h2 {
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <div id="sidebar">
    <h2>Kunnskapsbygget</h2>
    <div id="tree"></div>
  </div>

  <div id="main">
    <div id="header">
      <h1 id="title">Oversikt</h1>
      <div class="path" id="path">00_Oversikt</div>
    </div>
    <div id="content"></div>
  </div>

  <div id="activity">
    <h2>Hendelser under aktivitet</h2>
    <div id="eventLog"></div>
  </div>

<script>
const structure = [
  {
    id: "oversikt",
    name: "00_Oversikt",
    type: "folder",
    children: [
      { id: "status", name: "status.html", type: "page" }
    ]
  },
  {
    id: "prosjekt",
    name: "01_Prosjekt",
    type: "folder",
    children: [
      {
        id: "vertical",
        name: "vertical-slice",
        type: "folder",
        children: [
          { id: "oppgaver", name: "oppgaver.html", type: "page" },
          { id: "hendelser", name: "hendelser.html", type: "page" },
          { id: "dokumentasjon", name: "dokumentasjon.html", type: "page" }
        ]
      }
    ]
  },
  {
    id: "roller",
    name: "02_Roller",
    type: "folder",
    children: [
      { id: "ag002", name: "AG-002", type: "page" },
      { id: "ag003", name: "AG-003", type: "page" }
    ]
  },
  {
    id: "aktivitet",
    name: "03_Aktivitet",
    type: "folder",
    children: [
      { id: "logg", name: "hendelseslogg.html", type: "page" }
    ]
  }
];

const pages = {
  status: {
    title: "Status",
    path: "00_Oversikt / status.html",
    content: `
      <div class="card">
        <h3>Prosjektstatus</h3>
        <p>Vertical slice – mobilspill</p>
        <p style="margin-top:8px;">Nåværende status: <span class="status status-GUL">GUL</span></p>
        <p style="margin-top:12px; color: var(--muted);">2 kritiske kort uten eier. 1 antakelse behandlet som fakta.</p>
      </div>
    `
  },
  oppgaver: {
    title: "Oppgaver",
    path: "01_Prosjekt / vertical-slice / oppgaver.html",
    content: `
      <div class="card">
        <h3>Åpne oppgaver</h3>
        <p>• Android build – OutOfMemoryError (kritisk)</p>
        <p>• Art-scope – beslutning mangler</p>
        <p>• Lydlisens – hull</p>
        <textarea class="note-input" placeholder="Skriv notat / samhandling på oppgave..."></textarea>
        <button onclick="addEvent('Notat lagt til på oppgave')">Lagre notat</button>
      </div>
    `
  },
  hendelser: {
    title: "Hendelser",
    path: "01_Prosjekt / vertical-slice / hendelser.html",
    content: `
      <div class="card">
        <h3>Hendelser i vertical slice</h3>
        <div class="event"><div class="time">I dag 18:42</div>Build feilet på Android. Logg vedlagt.</div>
        <div class="event"><div class="time">I går 15:10</div>Art lead meldte at tre karakterer ikke rekker leveranse.</div>
      </div>
    `
  },
  dokumentasjon: {
    title: "Dokumentasjon",
    path: "01_Prosjekt / vertical-slice / dokumentasjon.html",
    content: `
      <div class="card">
        <h3>Dokumentasjon</h3>
        <p>Kildeautoritet og evidens for vertical slice.</p>
        <ul style="margin:12px 0 0 20px; color: var(--muted);">
          <li>Build-logg (Android)</li>
          <li>Spilltest-notater</li>
          <li>Publisher-møtereferat</li>
        </ul>
      </div>
    `
  },
  ag002: {
    title: "AG-002",
    path: "02_Roller / AG-002",
    content: `
      <div class="card">
        <h3>AG-002 – Prosjektkontroll</h3>
        <p>Fremdrift, ressurser, avvik og tiltak med eier og frist.</p>
      </div>
    `
  },
  ag003: {
    title: "AG-003",
    path: "02_Roller / AG-003",
    content: `
      <div class="card">
        <h3>AG-003 – Dokumentasjon & evidens</h3>
        <p>Tidslinje, kildeautoritet, FDV og beslutningslogg.</p>
      </div>
    `
  },
  logg: {
    title: "Hendelseslogg",
    path: "03_Aktivitet / hendelseslogg.html",
    content: `
      <div class="card">
        <h3>Samlet hendelseslogg</h3>
        <p>Oversikt over all aktivitet på tvers av prosjektet.</p>
      </div>
    `
  }
};

const events = [
  { time: "18:42", text: "Build feilet på Android" },
  { time: "15:10", text: "Art lead: scope-endring foreslått" },
  { time: "12:05", text: "Spilltest: tutorial for lang" }
];

function renderTree() {
  const tree = document.getElementById("tree");
  tree.innerHTML = "";
  structure.forEach(folder => {
    const f = document.createElement("div");
    f.className = "tree-item folder";
    f.textContent = folder.name;
    f.onclick = () => selectPage(folder.children?.[0]?.id || "status");
    tree.appendChild(f);
    (folder.children || []).forEach(child => {
      const c = document.createElement("div");
      c.className = "tree-item child";
      c.textContent = child.name;
      c.onclick = () => selectPage(child.id);
      tree.appendChild(c);
      if (child.children) {
        child.children.forEach(sub => {
          const s = document.createElement("div");
          s.className = "tree-item child";
          s.style.paddingLeft = "48px";
          s.textContent = sub.name;
          s.onclick = () => selectPage(sub.id);
          tree.appendChild(s);
        });
      }
    });
  });
}

function selectPage(id) {
  const page = pages[id] || pages.status;
  document.getElementById("title").textContent = page.title;
  document.getElementById("path").textContent = page.path;
  document.getElementById("content").innerHTML = page.content;

  document.querySelectorAll(".tree-item").forEach(el => el.classList.remove("active"));
  event?.target?.classList?.add("active");
}

function renderEvents() {
  const log = document.getElementById("eventLog");
  log.innerHTML = events.map(e => `
    <div class="event">
      <div class="time">${e.time}</div>
      ${e.text}
    </div>
  `).join("");
}

function addEvent(text) {
  const now = new Date();
  const time = now.getHours().toString().padStart(2,"0") + ":" + now.getMinutes().toString().padStart(2,"0");
  events.unshift({ time, text });
  renderEvents();
}

renderTree();
renderEvents();
selectPage("status");
</script>
</body>
</html>
